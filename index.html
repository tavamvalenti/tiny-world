<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4efe6; --dim:rgba(244,239,230,.62); --glass:rgba(18,20,24,.46); --line:rgba(255,255,255,.14); --accent:#ffb347; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0d0f12; color:var(--ink); font-family:Inter,system-ui,sans-serif; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .bar { position:fixed; left:0; right:0; height:4.2vh; background:#000; z-index:5; pointer-events:none; }
  .bar.top { top:0; } .bar.bot { bottom:0; }

  #menu { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background: radial-gradient(ellipse at 50% 40%, rgba(40,46,52,.55), rgba(8,9,11,.92) 70%); backdrop-filter: blur(6px); }
  #menu h1 { font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(44px,8vw,96px); letter-spacing:.08em; margin:0; }
  #menu p.sub { margin:0 0 26px; color:var(--dim); font-style:italic; font-family:'Playfair Display',serif; font-size:clamp(15px,2vw,20px); text-align:center; padding:0 16px; }
  #menu .maps { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:0 16px; }
  #menu button { font:600 13px Inter,sans-serif; letter-spacing:.22em; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line);
    padding:18px 30px; min-width:200px; border-radius:2px; cursor:pointer; transition:all .18s; }
  #menu button:hover { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.4); transform:translateY(-1px); }
  #menu button small { display:block; font-weight:400; letter-spacing:.04em; color:var(--dim); margin-top:6px; font-size:11px; }
  #loading { position:fixed; inset:0; z-index:25; display:none; align-items:center; justify-content:center; background:#0d0f12;
    font:500 12px Inter; letter-spacing:.3em; color:var(--dim); }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #weapons { position:absolute; left:50%; bottom:calc(4.2vh + 14px); transform:translateX(-50%); display:flex; gap:6px; pointer-events:auto; }
  #weapons .w { font:600 11px Inter; letter-spacing:.16em; color:var(--dim); background:var(--glass); border:1px solid var(--line);
    padding:9px 14px; border-radius:2px; backdrop-filter:blur(8px); cursor:pointer; user-select:none; transition:all .15s; white-space:nowrap; }
  #weapons .w b { color:rgba(255,255,255,.4); margin-right:6px; font-weight:500; }
  #weapons .w.on { color:#fff; border-color:var(--wc,#fff); box-shadow:0 0 0 1px var(--wc,#fff) inset, 0 0 18px -4px var(--wc,#fff); }
  #weapons .w.on b { color:var(--wc,#fff); }
  #help { position:absolute; left:16px; bottom:calc(4.2vh + 14px); font:400 10.5px/1.7 Inter; color:rgba(255,255,255,.55); letter-spacing:.06em;
    text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #help span { color:rgba(255,255,255,.85); display:inline-block; min-width:52px; }
  #mapname { position:absolute; left:16px; top:calc(4.2vh + 12px); font:600 11px Inter; letter-spacing:.3em; color:rgba(255,255,255,.75); text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .region { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:8px; font:600 11px Inter; letter-spacing:.24em; color:rgba(255,255,255,.82); }
  .region .ico { width:24px; height:16px; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.25); flex:none; }
  .region .ico.sd { box-shadow:none; background:#fff8e6; border-radius:3px; }
  #mapname .region { justify-content:flex-start; margin-top:6px; font-size:10px; }
  #mapname small { display:block; font-weight:400; letter-spacing:.1em; color:rgba(255,255,255,.45); margin-top:4px; }
  #topright { position:absolute; right:16px; top:calc(4.2vh + 12px); display:flex; gap:8px; align-items:center; pointer-events:auto; }
  #tod { display:flex; gap:2px; }
  #tod .t, #mute { font:600 10px Inter; letter-spacing:.18em; color:var(--dim); background:var(--glass); border:1px solid var(--line); padding:6px 9px; cursor:pointer; backdrop-filter:blur(8px); user-select:none; }
  #tod .t.on { color:#fff; border-color:rgba(255,255,255,.55); }
  #stats { position:absolute; right:16px; top:calc(4.2vh + 44px); font:400 10px Inter; letter-spacing:.1em; color:rgba(255,255,255,.4); text-align:right; }
  @media (max-width:760px) { #help { display:none; } #weapons .w { padding:8px 8px; letter-spacing:.06em; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div class="bar top"></div><div class="bar bot"></div>

<div id="menu">
  <h1>TINY WORLD</h1>
  <p class="sub">An interactive miniature destruction sandbox</p>
  <div class="maps">
    <button data-map="downtown">GASLAMP DISTRICT<span class="region"><svg class="ico sd" viewBox="0 0 30 20" aria-label="SD"><text x="8.2" y="16.2" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="17" fill="#2f241d" stroke="#ffc425" stroke-width=".9" paint-order="stroke">S</text><text x="13.4" y="17" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="16" fill="#2f241d" stroke="#ffc425" stroke-width=".9" paint-order="stroke">D</text></svg>DAYGO</span><small>Downtown · brick, glass &amp; crowds</small></button>
    <button data-map="tropical">LA PLAYA<span class="region"><svg class="ico" viewBox="0 0 30 20" aria-label="Mexico flag"><rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/><ellipse cx="15" cy="10.3" rx="2.4" ry="2.2" fill="#8c5a2b"/><path d="M12.3 11.6q2.7 2.3 5.4 0" stroke="#4b7a2e" stroke-width=".8" fill="none"/></svg>MEXICO</span><small>Tropical town · beach, hotels &amp; palms</small></button>
    <button data-map="suburbs">GLOCKTON<span class="region"><svg class="ico" viewBox="0 0 30 20" aria-label="California flag"><rect width="30" height="20" fill="#fff"/><rect y="16.6" width="30" height="3.4" fill="#b22234"/><polygon fill="#b22234" points="3.2,1.6 3.8,3.3 5.6,3.3 4.1,4.3 4.7,6 3.2,5 1.7,6 2.3,4.3 0.8,3.3 2.6,3.3"/><path fill="#6b4226" d="M8.5 11.6c1.2-2 4.2-2.9 7.4-2.6 2.2.2 3.4-.6 4.7-.4 1.1.2 1.8 1 2.6 1.1.6.1 1 .5.8 1-.2.4-.8.5-1.3.5-.6 1.1-1.6 1.6-2.6 1.7l.3 1.9h-1.1l-.6-1.7c-1.4.2-3 .2-4.6 0l-.6 1.7h-1.1l.1-1.9c-1.2-.2-2.3-.3-3-.4z"/><rect x="7" y="14.6" width="16" height="0.7" fill="#4b7a2e"/></svg>CALIFORNIA</span><small>Suburbs · lawns, school &amp; main street</small></button>
  </div>
</div>
<div id="loading">BUILDING MINIATURE…</div>

<div id="hud">
  <div id="mapname"><span id="mapTitle">GASLAMP DISTRICT</span><span class="region" id="mapRegion"></span><small>Esc — back to menu</small></div>
  <div id="stats"></div>
  <div id="topright">
    <div id="tod"><span class="t" data-t="day">DAY</span><span class="t" data-t="sunset">SUNSET</span><span class="t" data-t="night">NIGHT</span></div>
    <span id="mute">SOUND ON</span>
  </div>
  <div id="weapons">
    <div class="w" data-w="0" style="--wc:#ff5a3c"><b>1</b>LASER</div>
    <div class="w" data-w="1" style="--wc:#ffb347"><b>2</b>BOMB</div>
    <div class="w" data-w="2" style="--wc:#bfe9ff"><b>3</b>WIND</div>
    <div class="w" data-w="3" style="--wc:#ff7a1a"><b>4</b>METEOR</div>
    <div class="w" data-w="4" style="--wc:#8a7dff"><b>5</b>ENERGY</div>
  </div>
  <div id="help">
    <span>WASD</span>Move<br><span>Mouse</span>Aim<br><span>Click</span>Fire (hold laser / wind)<br><span>Scroll</span>Zoom<br><span>Q / E</span>Rotate<br><span>1–5</span>Weapons<br><span>T</span>Day / sunset / night<br><span>M</span>Mute
  </div>
</div>

<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
